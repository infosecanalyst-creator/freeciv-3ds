name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  n3ds:
    name: Nintendo 3DS
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools and 3DS libraries
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential autoconf automake libtool pkg-config gettext autopoint \
            python3 zlib1g-dev libcurl4-openssl-dev libsqlite3-dev git >/dev/null
          for i in 1 2 3 4; do dkp-pacman -Sy --noconfirm --needed 3ds-dev 3ds-curl 3ds-mbedtls 3ds-zlib && break; echo "retry $i"; sleep 30; done
      - name: Cache Freeciv engine build
        id: core
        uses: actions/cache@v4
        with:
          path: |
            freeciv
            3ds_port/romfs/data
          key: freeciv-core-${{ hashFiles('port-patches/**', 'scripts/build_freeciv_core.sh') }}
      - name: Build Freeciv engine (ARM11, static)
        if: steps.core.outputs.cache-hit != 'true'
        run: bash scripts/build_freeciv_core.sh
      - name: Build the 3DS client
        run: |
          export DEVKITPRO=/opt/devkitpro DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$PATH:$DEVKITPRO/tools/bin:$DEVKITARM/bin
          cd 3ds_port && make -j"$(nproc)"
          cp 3ds_port.3dsx freeciv3ds.3dsx
      - uses: actions/upload-artifact@v4
        with:
          name: freeciv3ds
          path: |
            3ds_port/freeciv3ds.3dsx
            3ds_port/3ds_port.elf

  # Every green build of main also goes to the "builds" branch, so the latest
  # .3dsx can be fetched through the GitHub API.
  publish-latest:
    name: Publish latest build
    if: github.ref == 'refs/heads/main'
    needs: [n3ds]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freeciv3ds
          path: out
      - name: Commit to the builds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git clone --depth 1 --branch builds "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pub 2>/dev/null \
            || { mkdir pub && cd pub && git init -q -b builds && cd ..; }
          cd pub
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p 3ds
          cp ../out/freeciv3ds.3dsx ../out/3ds_port.elf 3ds/
          printf '%s\n%s\n%s\n' "${GITHUB_SHA}" "${GITHUB_RUN_NUMBER}" "$(date -u +%FT%TZ)" > BUILD.txt
          git config user.name "freeciv-3ds-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}" || exit 0
          git push -q origin builds
