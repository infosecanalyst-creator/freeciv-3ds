name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  n3ds:
    name: Nintendo 3DS
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools and 3DS libraries
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential autoconf automake libtool pkg-config gettext autopoint \
            python3 zlib1g-dev libcurl4-openssl-dev libsqlite3-dev git unzip curl >/dev/null
          for i in 1 2 3 4; do dkp-pacman -Sy --noconfirm --needed 3ds-dev 3ds-curl 3ds-mbedtls 3ds-zlib && break; echo "retry $i"; sleep 30; done
      - name: Cache Freeciv engine build
        id: core
        uses: actions/cache@v4
        with:
          path: |
            freeciv
            3ds_port/romfs/data
          key: freeciv-core-${{ hashFiles('port-patches/**', 'scripts/build_freeciv_core.sh') }}
      - name: Build Freeciv engine (ARM11, static)
        if: steps.core.outputs.cache-hit != 'true'
        run: bash scripts/build_freeciv_core.sh
      - name: Build the 3DS client
        run: |
          export DEVKITPRO=/opt/devkitpro DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$PATH:$DEVKITPRO/tools/bin:$DEVKITARM/bin
          cd 3ds_port && make -j"$(nproc)"
          cp 3ds_port.3dsx freeciv3ds.3dsx
          # test build: new games on the isometric map with Amplio2 graphics
          touch source/main.c && rm -f 3ds_port.smdh && make -j"$(nproc)" AMPLIO=1
          cp 3ds_port.3dsx freeciv3ds-amplio.3dsx
          touch source/main.c && rm -f 3ds_port.smdh && make -j"$(nproc)"   # leave the normal build for the CIA
      - name: Publish the .3dsx to the builds branch (works even when artifact storage is full)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config --global --add safe.directory '*'
          git clone --depth 1 --branch builds "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pub 2>/dev/null \
            || { mkdir /tmp/pub && cd /tmp/pub && git init -q -b builds; }
          cd /tmp/pub
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p 3ds
          cp "$GITHUB_WORKSPACE/3ds_port/freeciv3ds.3dsx" freeciv3ds.3dsx
          cp "$GITHUB_WORKSPACE/3ds_port/freeciv3ds.3dsx" 3ds/freeciv3ds.3dsx
          echo "$GITHUB_SHA" > SOURCE_COMMIT
          printf '%s\n%s\n%s\n' "${GITHUB_SHA}" "${GITHUB_RUN_NUMBER}" "$(date -u +%FT%TZ)" > BUILD.txt
          git config user.name "freeciv-3ds-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}" || exit 0
          git push -q -f origin builds
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # artifact storage quota may be full; the builds branch has the binary
        with:
          name: freeciv3ds
          path: |
            3ds_port/freeciv3ds.3dsx
            3ds_port/freeciv3ds-amplio.3dsx
            3ds_port/3ds_port.elf
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # artifact storage quota may be full; the builds branch has the binary
        with:
          name: cia-inputs
          path: |
            3ds_port/3ds_port.elf
            3ds_port/romfs
            3ds_port/cia
          retention-days: 3

  # makerom needs a newer glibc than the devkitPro image, so the CIA is
  # packaged on the stock runner from the ELF + RomFS built above.
  cia:
    name: CIA package
    needs: [n3ds]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cia-inputs
          path: in
      - name: Package CIA (installs to the HOME menu)
        run: |
          set -e
          mkdir -p /tmp/tools && cd /tmp/tools
          pick() { python3 -c "import sys,json; a=[x['browser_download_url'] for x in json.load(sys.stdin)['assets'] if $1]; print(a[0])"; }
          curl -sL -o makerom.zip "$(curl -s https://api.github.com/repos/3DSGuy/Project_CTR/releases/latest | pick "'makerom' in x['name'].lower() and ('ubuntu' in x['name'].lower() or 'linux' in x['name'].lower())")"
          unzip -o -q makerom.zip -d makerom
          MAKEROM=$(find /tmp/tools/makerom -type f -name 'makerom*' ! -name '*.zip' | head -1); chmod +x "$MAKEROM"
          curl -sL -o bannertool.zip "$(curl -s https://api.github.com/repos/Epicpkmn11/bannertool/releases/latest | pick "x['name'].endswith('.zip')")"
          unzip -o -q bannertool.zip -d bannertool
          BT=$(find /tmp/tools/bannertool -type f -name bannertool -path '*linux*' | grep -i 'x86\|amd64' | head -1); chmod +x "$BT"
          cd "$GITHUB_WORKSPACE/in"
          "$BT" makebanner -i cia/banner.png -a cia/banner.wav -o cia/banner.bnr
          "$BT" makesmdh -s "Freeciv 3DS" -l "Empire-building strategy (Freeciv)" -p "Freeciv 3DS contributors" -i cia/icon.png -o cia/icon.icn
          "$MAKEROM" -f cia -o freeciv3ds.cia -elf 3ds_port.elf -rsf cia/cia.rsf -icon cia/icon.icn -banner cia/banner.bnr -exefslogo -target t
          ls -la freeciv3ds.cia
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # artifact storage quota may be full; the builds branch has the binary
        with:
          name: freeciv3ds-cia
          path: in/freeciv3ds.cia

  # Every green build of main also goes to the "builds" branch, so the latest
  # .3dsx can be fetched through the GitHub API.
  publish-latest:
    name: Publish latest build
    if: always() && github.ref == 'refs/heads/main' && needs.n3ds.result == 'success'
    needs: [n3ds, cia]
    runs-on: ubuntu-latest
    continue-on-error: true   # extra copy only: the n3ds job already put the .3dsx on the builds branch
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freeciv3ds
          path: out
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: freeciv3ds-cia
          path: out
      - name: Commit to the builds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git clone --depth 1 --branch builds "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pub 2>/dev/null \
            || { mkdir pub && cd pub && git init -q -b builds && cd ..; }
          cd pub
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p 3ds
          cp ../out/freeciv3ds.3dsx ../out/3ds_port.elf 3ds/
          [ -f ../out/freeciv3ds.cia ] && cp ../out/freeciv3ds.cia 3ds/ || true
          printf '%s\n%s\n%s\n' "${GITHUB_SHA}" "${GITHUB_RUN_NUMBER}" "$(date -u +%FT%TZ)" > BUILD.txt
          git config user.name "freeciv-3ds-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}" || exit 0
          git push -q origin builds

  # Pushing a tag like v1.0 publishes a GitHub Release with the .3dsx and .cia.
  release:
    name: GitHub Release
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.n3ds.result == 'success'
    needs: [n3ds, cia]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freeciv3ds
          path: out
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: freeciv3ds-cia
          path: out
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="out/freeciv3ds.3dsx"
          [ -f out/freeciv3ds.cia ] && files="$files out/freeciv3ds.cia"
          gh release create "${GITHUB_REF_NAME}" $files --repo "${GITHUB_REPOSITORY}" \
            --title "Freeciv 3DS ${GITHUB_REF_NAME}" --generate-notes
